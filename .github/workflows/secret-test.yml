name: Secret Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DAS_GROSSE_SECRET: ${{ secrets.DAS_GROSSE_SECRET }}
    steps:
      - name: Secret pruefen
        run: |
          if [ -n "$DAS_GROSSE_SECRET" ]; then
            echo "Secret ist gesetzt"
          else
            echo "Secret fehlt"
          fi
      - name: Versuch, Secret auszugeben
        run: echo "Wert: $DAS_GROSSE_SECRET"
